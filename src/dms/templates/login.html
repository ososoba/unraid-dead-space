{% extends "base.html" %}
{% block title %}Sign in — Dead Movies &amp; Shows{% endblock %}
{% block content %}
<section class="login">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="_csrf" value="{{ csrf_token(request) }}" />
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus />
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">
    Set <code>APP_USERNAME</code> and <code>APP_PASSWORD_HASH</code> in your
    <code>.env</code>. Generate the hash with
    <code>python&nbsp;-m&nbsp;dms.cli.hash_password</code>.
  </p>
</section>
{% endblock %}
