<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>{% block title %}Dead Movies & Shows{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">Dead Movies &amp; Shows</a>
    {% if user %}
      <nav>
        <a href="/">Dashboard</a>
        <a href="/requesters">Requesters</a>
        <a href="/ignored">Ignored</a>
        <a href="/config">Config</a>
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="_csrf" value="{{ csrf_token(request) }}" />
          <button type="submit" class="link">Sign out ({{ user }})</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
